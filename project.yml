name: Spendly
options:
  bundleIdPrefix: com.sameetasadullah
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Release:
      VALIDATE_PRODUCT: YES
targets:
  Spendly:
    type: application
    platform: iOS
    sources:
      - path: Spendly
        type: syncedFolder
    scheme:
      testTargets:
        - SpendlyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameetasadullah.spendly
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spendly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Spendly uses Face ID to unlock your expenses."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 99NBFU9494
        CODE_SIGN_STYLE: Automatic
  SpendlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpendlyTests
        type: syncedFolder
    dependencies:
      - target: Spendly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameetasadullah.spendly.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Spendly.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Spendly"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: 99NBFU9494
        CODE_SIGN_STYLE: Automatic
